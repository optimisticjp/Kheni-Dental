name: Preview Kheni Dental on Cloudflare

# Review preview only. This workflow uploads a Cloudflare Worker VERSION and never
# creates a deployment, so the live Worker at kheni-dental.essanciaonline.workers.dev
# keeps serving whatever version main last deployed.
#
# Production deployment stays in deploy-cloudflare.yml, which is untouched.
#
#   claude/** push -> build + checks -> wrangler versions upload -> preview URL
#   approval -> commit moved to main -> deploy-cloudflare.yml -> production
#
# Rejecting a preview needs no rollback, because production never changed.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: kheni-dental-review-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # workflow_dispatch lets a human pick any branch, so refuse main explicitly.
      # A preview upload on main would still not deploy, but the guard keeps the
      # production and preview paths from ever overlapping.
      - name: Refuse to run against main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::preview-cloudflare.yml must never run against main. Production deploys are handled by deploy-cloudflare.yml."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Application source only. A full-repo lint also walks the vendored
      # .claude/skills tooling, which carries pre-existing errors unrelated to the site.
      - name: Lint application source
        run: npx eslint src

      - name: Build for Cloudflare
        run: npm run build:vinext

      # versions upload creates an immutable Worker version with its own preview URL.
      # It does not change which version production traffic is served from.
      # Never use `wrangler deploy` or `npm run deploy:vinext` here.
      - name: Upload preview version to Cloudflare
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --config dist/server/wrangler.json \
            --preview-alias review \
            --message "Preview of ${GITHUB_SHA} on ${GITHUB_REF_NAME}" \
            2>&1 | tee upload.log

          # Wrangler prints the versioned preview URL and, when an alias is
          # accepted, an aliased URL too. Capture whichever exist.
          ALIAS_URL="$(grep -oE 'https://review-[A-Za-z0-9.-]+\.workers\.dev' upload.log | head -1 || true)"
          VERSION_URL="$(grep -oE 'https://[A-Za-z0-9-]+-kheni-dental\.[A-Za-z0-9.-]+\.workers\.dev' upload.log | grep -v '^https://review-' | head -1 || true)"
          VERSION_ID="$(grep -oE 'Worker Version ID: *[0-9a-f-]+' upload.log | head -1 | awk '{print $NF}' || true)"

          {
            echo "alias_url=${ALIAS_URL}"
            echo "version_url=${VERSION_URL}"
            echo "version_id=${VERSION_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish preview URL to job summary
        run: |
          {
            echo "## Kheni Dental review preview"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Version ID | \`${{ steps.upload.outputs.version_id }}\` |"
            if [ -n "${{ steps.upload.outputs.alias_url }}" ]; then
              echo "| Stable review URL | ${{ steps.upload.outputs.alias_url }} |"
            fi
            if [ -n "${{ steps.upload.outputs.version_url }}" ]; then
              echo "| Versioned URL | ${{ steps.upload.outputs.version_url }} |"
            fi
            echo
            echo "Production is unchanged: this run uploaded a Worker version and created no deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wrangler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-preview-log
          path: upload.log
          if-no-files-found: ignore
          retention-days: 7

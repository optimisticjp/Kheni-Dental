name: Deploy Kheni Dental to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kheni-dental-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The marketing ids are NOT passed here. They were, and this build
      # silently dropped them: the deployed chunk came out carrying
      # `{}.NEXT_PUBLIC_META_PIXEL_ID`, so every id evaluated to "" while
      # the same build inlined them correctly on a developer's machine.
      # They are constants in src/lib/tracking-ids.ts now, and preview
      # isolation is a runtime hostname check that no bundler can drop.
      #
      # NEXT_PUBLIC_ALLOW_INDEXING is deliberately absent. Search indexing
      # stays off until the clinic approves launch, and ads do not need it.
      - name: Build for Cloudflare
        run: npm run build:vinext

      - name: Deploy to Cloudflare
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
